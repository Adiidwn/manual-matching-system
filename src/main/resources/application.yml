spring:
  application:
    name: reconciliation
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reconciliation}
    username: ${SPRING_DATASOURCE_USERNAME:reconciliation}
    password: ${SPRING_DATASOURCE_PASSWORD:reconciliation}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: reconciliation-file-import
      auto-offset-reset: earliest
      max-poll-records: 1
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.example.reconciliation.imports.FileImportRequested
        spring.json.trusted.packages: com.example.reconciliation.imports
        spring.json.use.type.headers: false
        max.poll.interval.ms: 1800000
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  import:
    inbox: ${APP_IMPORT_INBOX:./inbox}
    processing: ${APP_IMPORT_PROCESSING:./import-processing}
    archive: ${APP_IMPORT_ARCHIVE:./import-archive}
    error: ${APP_IMPORT_ERROR:./import-error}
    poll-interval-ms: ${APP_IMPORT_POLL_INTERVAL_MS:30000}
    initial-delay-ms: ${APP_IMPORT_INITIAL_DELAY_MS:10000}
    chunk-size: ${APP_IMPORT_CHUNK_SIZE:1000}
