name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests and build all modules
        run: mvn -B verify
      - name: Upload deployable jars
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-jars
          path: |
            api-service/target/reconciliation-api-*.jar
            import-worker/target/reconciliation-worker-*.jar

  docker:
    name: Build Docker image (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            file: api-service/Dockerfile
          - service: worker
            file: import-worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f ${{ matrix.file }} -t reconciliation-${{ matrix.service }}:ci .

  publish:
    name: Publish image (${{ matrix.service }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            file: api-service/Dockerfile
          - service: worker
            file: import-worker/Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}:${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.IMAGE_NAME }}
